name: check

on:
  # Gatilho principal: o cron-job.org chama a API do GitHub a cada 15 min, das
  # 8h as 22h (Brasilia), com origem=cron. O token dele so tem permissao de
  # Actions (disparar este workflow), nao de mexer no codigo. O agendador do
  # proprio Actions e best-effort e descarta execucao sob carga.
  # Rodando a mao (Run workflow), origem fica "manual" e ignora a janela.
  workflow_dispatch:
    inputs:
      origem:
        description: "manual ou cron"
        default: "manual"

  # Gatilho antigo (token com permissao de codigo). Mantido so para a transicao.
  repository_dispatch:
    types: [check]

  # Rede de seguranca, nao o relogio principal: a cada 2 h, 8h-22h Brasilia.
  # O repositorio e privado e cada execucao conta minutos da cota gratis;
  # o bot.py pula se a ultima verificacao foi ha menos de 12 min.
  schedule:
    - cron: "37 11,13,15,17,19,21,23 * * *"

concurrency:
  group: abecmed-alerta
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Rodar
        env:
          ABECMED_CPF: ${{ secrets.ABECMED_CPF }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PRECO_MAX_FLOR: ${{ vars.PRECO_MAX_FLOR }}
          ORIGEM: ${{ inputs.origem }}
        run: python3 bot.py

      # always(): quando o fluxo quebra o passo acima sai com 1, mas o estado
      # traz o flag "ja avisei que quebrou". Sem salvar, a quebra notificaria
      # de novo a cada verificacao.
      - name: Salvar estado
        if: always()
        run: |
          if [ -z "$(git status --porcelain estado.json)" ]; then
            echo "nada a salvar"; exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estado.json
          git commit -m "estado: $(date -u +%Y-%m-%dT%H:%MZ)"
          # Um push manual no meio do caminho nao pode derrubar a verificacao.
          for tentativa in 1 2 3; do
            git push && exit 0
            echo "push recusado (tentativa $tentativa), rebaseando"
            git pull --rebase --autostash || true
            sleep 5
          done
          echo "::warning::nao consegui salvar o estado; a proxima verificacao repete a notificacao"

      # Dead man's switch. Um monitor parado nao consegue avisar que parou —
      # quem percebe o silencio tem que estar de fora. Pinga em always() de
      # proposito: fluxo quebrado o proprio bot.py ja notifica no ntfy, entao
      # aqui a pergunta e so "a verificacao aconteceu?".
      - name: Ping do watchdog
        if: always()
        env:
          HC_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          if [ -z "$HC_URL" ]; then
            echo "HEALTHCHECK_URL nao configurado; pulando"; exit 0
          fi
          curl -fsS --retry 3 --max-time 10 "$HC_URL" >/dev/null && echo "watchdog pingado"
